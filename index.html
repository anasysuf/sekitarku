<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Sekitarku: Dashboard Pantauan Lingkungan Real-time Indonesia</title>
    <meta name="description" content="Dashboard pemantauan kualitas udara (AQI), cuaca BMKG, indeks UV, gempa bumi, dan gunung api aktif real-time di seluruh Indonesia." />
    
    <!-- PWA meta tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- DNS Prefetch & Preconnect for High-Speed API & Map Tiles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://api.open-meteo.com">
    <link rel="preconnect" href="https://air-quality-api.open-meteo.com">
    <link rel="preconnect" href="https://data.bmkg.go.id">
    <link rel="preconnect" href="https://a.tile.openstreetmap.org">
    <link rel="preconnect" href="https://b.tile.openstreetmap.org">
    <link rel="preconnect" href="https://c.tile.openstreetmap.org">
    <link rel="dns-prefetch" href="https://a.tile.openstreetmap.org">
    <link rel="dns-prefetch" href="https://b.tile.openstreetmap.org">
    <link rel="dns-prefetch" href="https://c.tile.openstreetmap.org">
    
    <!-- Google Fonts with display=swap for instantaneous text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
